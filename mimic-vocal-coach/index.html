<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover makes env(safe-area-inset-*) real (notch, Dynamic Island, home indicator). Do NOT add
         maximum-scale=1 or user-scalable=no: inputs are already 16px so iOS never zooms on focus, and blocking
         pinch-zoom is an accessibility failure. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Record yourself singing and get coached toward the mixed-voice sound of Shawn Mendes, Daniel Caesar or Jalen Ngonda." />
    <title>Mimic Vocal Coach</title>

    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <!-- iOS uses this for Add to Home Screen (opaque, full-bleed 180x180; iOS rounds the corners). Manifest icons are only a
         fallback on iOS, and maskable ones are ignored there. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="theme-color" content="#eef0ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)" />

    <!-- Home Screen web app (standalone) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mimic" />
    <!-- "default": web content starts below the status bar and the system picks dark or light status-bar text.
         "black-translucent" would draw white status-bar text over our light paper colour. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
