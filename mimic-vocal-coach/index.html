<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Nothing here ever leaves the device, and the browser enforces it: no network except this origin and, for the optional AI coach
         (your own key, numbers only), api.anthropic.com. No forms, no <base>, no plug-ins, no frames. Workers and the audio worklet
         come from this origin or blob:/data: (the single-file build inlines its worker as data:). Scripts need 'unsafe-inline' because
         the single-file build inlines its module and the start-up check below is inline; the privacy guarantee is connect-src,
         img-src, media-src, font-src, form-action and base-uri, not script-src. Keep this in step with docs/IPHONE_CHECKLIST.md. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline' blob:; worker-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' blob: data:; manifest-src 'self'; connect-src 'self' blob: data: https://api.anthropic.com; base-uri 'none'; form-action 'none'"
    />
    <!-- viewport-fit=cover makes env(safe-area-inset-*) real (notch, Dynamic Island, home indicator). Do NOT add
         maximum-scale=1 or user-scalable=no: inputs are already 16px so iOS never zooms on focus, and blocking
         pinch-zoom is an accessibility failure. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Record yourself singing and get coached toward the mixed-voice sound of Shawn Mendes, Daniel Caesar or Jalen Ngonda." />
    <title>Mimic Vocal Coach</title>

    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <!-- iOS uses this for Add to Home Screen (opaque, full-bleed 180x180; iOS rounds the corners). Manifest icons are only a
         fallback on iOS, and maskable ones are ignored there. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="theme-color" content="#eef0ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)" />

    <!-- Home Screen web app (standalone) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mimic" />
    <!-- "default": web content starts below the status bar and the system picks dark or light status-bar text.
         "black-translucent" would draw white status-bar text over our light paper colour. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <noscript><p style="padding:24px;font:16px/1.5 system-ui,sans-serif">Mimic needs JavaScript to run. Turn it on in your browser settings and reload.</p></noscript>
    <!-- Start-up check, a classic script so it runs even when the app script cannot: an iPhone older than iOS 16.4 fails to parse the
         whole bundle and would otherwise show a blank page with no explanation. If nothing has drawn shortly after load, say so. -->
    <script>
      window.addEventListener('load', function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.firstChild) return;
          var p = document.createElement('p');
          p.setAttribute('style', 'padding:24px;font:16px/1.5 system-ui,sans-serif');
          p.textContent = 'Mimic could not start. It needs iOS 16.4 or newer (Safari or the Home Screen app) or a current desktop browser. If your device is up to date, reload the page.';
          root.appendChild(p);
        }, 3000);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
